name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "packages/skill-validator/**"
      - "packages/plugin-tools/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CLAUDE.md"
      - "apps/docs/app/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "packages/skill-validator/**"
      - "packages/plugin-tools/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CLAUDE.md"
      - "apps/docs/app/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install

      - name: Build validator
        run: bun turbo build --filter=@metapowers/skill-validator

      - name: Validate all skills
        run: bun run lint:skills

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifests
        run: claude plugin validate . --strict

      - name: Build plugin-tools
        run: bun turbo build --filter=@metapowers/plugin-tools

      - name: Check generated plugin files and counts
        run: bun run check:plugins
