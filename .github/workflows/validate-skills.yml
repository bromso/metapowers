name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "workflows/**"
      - "references/**"
      - "adapters/**"
      - "packages/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "apps/docs/app/**"
      - "apps/docs/content/**"
      - "apps/docs/scripts/**"
      - "apps/docs/lib/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "workflows/**"
      - "references/**"
      - "adapters/**"
      - "packages/**"
      - "scripts/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "apps/docs/app/**"
      - "apps/docs/content/**"
      - "apps/docs/scripts/**"
      - "apps/docs/lib/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install

      - name: Build validator
        run: bun turbo build --filter=@singularskills/skill-validator

      - name: Validate all skills
        run: bun run lint:skills

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.283
      - name: Validate plugin manifests
        run: claude plugin validate . --strict

      - name: Build pack-tools
        run: bun turbo build --filter=@singularskills/pack-tools

      - name: Check generated plugin files, counts, docs site data and skill pages
        run: bun run check:pack

      - name: Check eval cases (dry run, no Claude calls)
        run: bun run evals --dry

      - name: Check for leftover old-project naming
        run: bash scripts/check-rename.sh

      - name: Smoke-test the install for all Tier 1 agents
        timeout-minutes: 15
        run: bash scripts/smoke-install.sh --local
        env:
          SKILLS_CLI: skills@1.7.4
